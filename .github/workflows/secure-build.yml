name: secure-build

# Reusable workflow. Step 1 of 4: build a multi-arch image and push it to GHCR.
# Scanning, SBOM, signing and attestation are added in later pull requests.

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name in lowercase, e.g. ghcr.io/kenshoo-ops/sample-app"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
      runner:
        description: "Runner to use (GitHub-hosted by default)"
        type: string
        default: "ubuntu-24.04"
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v4

      - name: Set up QEMU (needed to build arm64 on an x64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
