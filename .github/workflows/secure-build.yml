name: secure-build

# Reusable workflow. Step 2 of 4: build a multi-arch image, push it to GHCR,
# and scan it with Trivy. SBOM, signing and attestation come in later pull requests.

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name in lowercase, e.g. ghcr.io/kenshoo-ops/sample-app"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
      runner:
        description: "Runner to use (GitHub-hosted by default)"
        type: string
        default: "ubuntu-24.04"
      severity:
        description: "Vulnerability severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v4

      - name: Set up QEMU (needed to build arm64 on an x64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Scan the exact image that was pushed, by digest, not by a movable tag.
      # If this step fails, the later steps (SBOM, signing) never run, so the
      # image stays unsigned and the cluster will refuse to run it.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          vuln-type: "os,library"
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table
