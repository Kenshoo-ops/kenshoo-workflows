name: secure-build

# Reusable workflow. Step 5: build a multi-arch image, push it to GHCR, scan it
# with Trivy, generate an SBOM with Syft, sign the image and attach the SBOM with
# cosign (keyless), and attach signed build provenance.

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name in lowercase, e.g. ghcr.io/kenshoo-ops/sample-app"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
      runner:
        description: "Runner to use (GitHub-hosted by default)"
        type: string
        default: "ubuntu-24.04"
      severity:
        description: "Vulnerability severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write       # lets the job request a short-lived identity token for keyless signing
      attestations: write   # lets the job store build provenance attestations
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (needed to build arm64 on an x64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Scan the exact image that was pushed, by digest, not by a movable tag.
      # If this step fails, the later steps (SBOM, signing) never run, so the
      # image stays unsigned and the cluster will refuse to run it.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          vuln-type: "os,library"
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Generate a software bill of materials for the exact image that was scanned.
      # Runs only if the scan passed. The SBOM is stored with the workflow run for now;
      # the signing step will later attach it to the image as a signed attestation.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Sign the image by digest. Keyless: the certificate records that this
      # signature came from this workflow, and expires within minutes.
      - name: Sign image with cosign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # Attach the SBOM as a signed statement about this exact image digest.
      - name: Attach SBOM as signed attestation
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # Signed record of how, where and from which commit this image was built.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
