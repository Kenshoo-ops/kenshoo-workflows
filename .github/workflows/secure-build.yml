name: secure-build

# Reusable workflow. Step 4: build a multi-arch image, push it to GHCR, scan it
# with Trivy, generate an SBOM with Syft, then sign the image and attach the SBOM
# with cosign (keyless). Build provenance comes in a later pull request.

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name in lowercase, e.g. ghcr.io/kenshoo-ops/sample-app"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
      runner:
        description: "Runner to use (GitHub-hosted by default)"
        type: string
        default: "ubuntu-24.04"
      severity:
        description: "Vulnerability severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
    outputs:
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write   # lets the job request a short-lived identity token for keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v4

      - name: Set up QEMU (needed to build arm64 on an x64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Scan the exact image that was pushed, by digest, not by a movable tag.
      # If this step fails, the later steps (SBOM, signing) never run, so the
      # image stays unsigned and the cluster will refuse to run it.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          vuln-type: "os,library"
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Generate a software bill of materials for the exact image that was scanned.
      # Runs only if the scan passed. The SBOM is stored with the workflow run for now;
      # the signing step will later attach it to the image as a signed attestation.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the image by digest. Keyless: the certificate records that this
      # signature came from this workflow, and expires within minutes.
      - name: Sign image with cosign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # Attach the SBOM as a signed statement about this exact image digest.
      - name: Attach SBOM as signed attestation
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
